<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timetable responsive preview</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:12px; font:14px Arial, sans-serif; background:#dfe1e2; color:#3f4447; }
    header { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
    label { display:flex; align-items:center; gap:7px; }
    select { padding:6px; font:inherit; }
    iframe { display:block; width:390px; height:844px; margin:auto; border:1px solid #8697a2; background:#fff; }
  </style>
</head>
<body>
  <header>
    <label>Screen width<select id="screenWidth"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>600</option><option>768</option><option>1024</option><option>1280</option></select></label>
    <label>Screen height<select id="screenHeight"><option>568</option><option>667</option><option selected>844</option><option>1024</option></select></label>
  </header>
  <iframe id="preview" title="Timetable preview" src="../?v=202610041600#timetable"></iframe>
  <script>
    const preview = document.getElementById("preview");
    document.getElementById("screenWidth").addEventListener("change", function (event) { preview.style.width = event.target.value + "px"; });
    document.getElementById("screenHeight").addEventListener("change", function (event) { preview.style.height = event.target.value + "px"; });
  </script>
</body>
</html>
